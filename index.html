const input=document.querySelector('#password');
const button=document.querySelector('#submit');
const msg=document.querySelector('#message');
const b64bytes=(value)=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));
async function unlock(pass){
  const passKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const decryptKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},passKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(payload.iv)},decryptKey,b64bytes(payload.data));
  return new TextDecoder('utf-8',{fatal:true}).decode(clear);
}
document.querySelector('#unlock').addEventListener('submit',async (ev)=>{
 ev.preventDefault();
 button.disabled=true;button.textContent='확인 중...';msg.textContent='';
 try{
  if(!crypto?.subtle){msg.textContent='보안 연결(HTTPS)에서 다시 접속해 주세요.';return;}
  const html=await unlock(input.value);
  input.value='';
  document.open();document.write(html);document.close();
 }catch(err){msg.textContent='비밀번호가 일치하지 않습니다. 다시 확인해 주세요.';input.select();}
 finally{button.disabled=false;button.textContent='가이드 열어보기 →';}
});
})();
</script>
